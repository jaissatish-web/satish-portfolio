name: Website checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build.py
      - run: git diff --exit-code
      - run: python scripts/validate.py
      - run: node --check assets/js/hub.js
      - run: node tests/engineering.test.js
      - run: node --check assets/js/engineering-tools.js
